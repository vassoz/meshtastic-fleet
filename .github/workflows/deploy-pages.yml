name: Deploy to GitHub Pages

# Every push to main is a "new version" of this static app -- there's no
# build step of our own beyond vendoring third-party dependencies (see
# tools/vendor.py), so continuous deployment on push is simpler and just
# as safe as gating on manual version tags.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-flight one finish rather than
# cancel it, so Pages never serves a half-deployed state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # vendor/ is gitignored (it's ~86 files of unmodified third-party
      # code, fully reproducible from PINNED_VERSIONS in tools/vendor.py)
      # -- regenerate it here so the deployed site is actually complete.
      - name: Vendor third-party dependencies
        run: python3 tools/vendor.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
